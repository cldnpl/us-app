name: Deploy backend to Railway

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        working-directory: server
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 9080937c-3792-4eff-a64a-131fb1b9908b
          RAILWAY_ENVIRONMENT_ID: cbc2dae9-be96-4488-8c22-a274bfabce91
          RAILWAY_SERVICE_ID: a6a9937e-d048-4214-b129-5d494175124d
        run: railway up --ci --yes --service us-app
